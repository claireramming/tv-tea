[tool.poetry]
name = "tv-tracker"
version = "0.1.0"
description = ""
authors = ["Claire Ramming <ceramming@gmail.com>"]
readme = "README.md"
packages = [
  { include = "backend" }
]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.10.15"

# Django and service related dependencies
django = "^5.1.5"
djangorestframework = "^3.15.2"
django-filter="^25.1.0"
authlib="^1.0"
python-dotenv="^0.19"
requests="^2.27"
dj-database-url="^2.3.0"
psycopg2-binary = "^2.9.10"
django-cors-headers = "^4.6.0"
pyjwt = "^2.10.0"
drf-jwt="^1.13.3"
gunicorn="^23.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-django = "^4.12.0"
pytest-mock = "^3.15.1"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
